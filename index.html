<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 900px;
            background-color: #1a1c23;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #15161e;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        #scoreBoard {
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            text-align: center;
            pointer-events: auto;
            word-break: break-all;
            line-height: 1.4;
        }
        #highScoreText {
            font-size: 16px;
            color: #ff0055;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.5);
            display: block;
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(13, 14, 21, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        #gameOverScreen.active {
            opacity: 1;
            pointer-events: auto;
        }
        h1 {
            font-size: 36px;
            color: #ff0055;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 10px;
        }
        #finalScore {
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
            word-break: break-all;
            padding: 0 20px;
            text-align: center;
            margin-bottom: 5px;
        }
        #finalHighScore {
            font-size: 18px;
            color: #ff0055;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.5);
            margin-bottom: 30px;
            font-weight: bold;
        }
        #restartBtn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #15161e;
            background-color: #00ffcc;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        #restartBtn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div id="scoreBoard">
                <div>SKOR: 0</div>
                <span id="highScoreText">TERTINGGI: 0</span>
            </div>
            <div class="controls-hint">Ketuk Kiri/Kanan Layar atau gunakan Panah/A-D</div>
        </div>

        <div id="gameOverScreen">
            <h1>Game Over</h1>
            <p>Skor Akhir Anda:</p>
            <p id="finalScore">0</p>
            <div id="finalHighScore">Tertinggi: 0</div>
            <button id="restartBtn">MAIN LAGI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('scoreBoard');
        const highScoreText = document.getElementById('highScoreText');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');
        const finalHighScore = document.getElementById('finalHighScore');
        const restartBtn = document.getElementById('restartBtn');

        // Target resolusi internal canvas untuk konsistensi game logic
        const INTERNAL_WIDTH = 400;
        const INTERNAL_HEIGHT = 700;
        canvas.width = INTERNAL_WIDTH;
        canvas.height = INTERNAL_HEIGHT;

        // Load High Score dari localStorage saat game dimuat pertama kali
        let highScore = 0n;
        if (localStorage.getItem('neon_runner_highscore')) {
            try {
                highScore = BigInt(localStorage.getItem('neon_runner_highscore'));
            } catch(e) {
                highScore = 0n;
            }
        }

        // System state menggunakan BigInt untuk skor tak terbatas
        let score = 0n;
        let scoreTimer = 0;
        let isGameOver = false;
        
        // Atur kecepatan awal dan batasan mekanik game
        const initialSpeed = 5;
        let gameSpeed = initialSpeed;
        const maxSpeed = 22;
        
        // Peningkatan kecepatan dinamis berdasarkan perolehan skor
        function updateDifficulty() {
            let bonusSpeed = Number(score) * 0.005; 
            gameSpeed = initialSpeed + bonusSpeed;
            if (gameSpeed > maxSpeed) gameSpeed = maxSpeed;

            // Mempercepat munculnya rintangan (spawn interval mengecil) saat game semakin cepat
            spawnInterval = Math.max(40, 100 - Math.floor(bonusSpeed * 4));
        }

        // Struktur jalur (2 Lane)
        const laneWidth = INTERNAL_WIDTH / 2;
        const lanes = [
            laneWidth / 2,                // Center lane 0 (Kiri)
            laneWidth + (laneWidth / 2)   // Center lane 1 (Kanan)
        ];

        // Objek Mobil Pemain
        const player = {
            lane: 0, // Mulai dari kiri
            x: lanes[0],
            y: INTERNAL_HEIGHT - 100,
            width: 45,
            height: 80,
            targetX: lanes[0],
            speed: 0.25, // Kecepatan interpolasi perpindahan jalur
            
            update() {
                this.targetX = lanes[this.lane];
                this.x += (this.targetX - this.x) * this.speed;
            },
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffcc';

                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);

                ctx.fillStyle = '#0d0e15';
                ctx.fillRect(-this.width/2 + 6, -this.height/2 + 15, this.width - 12, 20);

                ctx.shadowColor = '#ffffff';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-this.width/2 + 4, -this.height/2, 8, 4);
                ctx.fillRect(this.width/2 - 12, -this.height/2, 8, 4);

                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(-this.width/2 + 4, this.height/2 - 4, 8, 4);
                ctx.fillRect(this.width/2 - 12, this.height/2 - 4, 8, 4);

                ctx.restore();
            }
        };

        // Rintangan (Obstacles)
        let obstacles = [];
        let spawnTimer = 0;
        let spawnInterval = 100;

        class Obstacle {
            constructor() {
                this.lane = Math.floor(Math.random() * 2);
                this.x = lanes[this.lane];
                this.y = -60;
                this.width = 50;
                this.height = 50;
                this.type = Math.random() > 0.5 ? 'hole' : 'car';
                
                if (this.type === 'car') {
                    this.height = 75;
                    this.extraSpeed = 2;
                } else {
                    this.width = 55;
                    this.height = 35;
                    this.extraSpeed = 0;
                }
            }

            update() {
                this.y += gameSpeed + this.extraSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.shadowBlur = 12;
                if (this.type === 'car') {
                    ctx.shadowColor = '#ff0055';
                    ctx.fillStyle = '#ff0055';
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    
                    ctx.fillStyle = '#0d0e15';
                    ctx.fillRect(-this.width/2 + 6, this.height/2 - 35, this.width - 12, 20);
                } else {
                    ctx.shadowColor = '#ffcc00';
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    ctx.fillStyle = '#0d0e15';
                    ctx.fillRect(-this.width/2 + 5, -this.height/2 + 5, this.width - 10, this.height - 10);
                }

                ctx.restore();
            }
        }

        let backgroundY = 0;
        function drawBackground() {
            backgroundY += gameSpeed;
            if (backgroundY >= 60) backgroundY = 0;

            ctx.strokeStyle = 'rgba(0, 255, 204, 0.08)';
            ctx.lineWidth = 2;

            ctx.setLineDash();
            ctx.beginPath();
            ctx.moveTo(INTERNAL_WIDTH / 2, 0);
            ctx.lineTo(INTERNAL_WIDTH / 2, INTERNAL_HEIGHT);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = 'rgba(0, 255, 204, 0.04)';
            for (let y = backgroundY - 60; y < INTERNAL_HEIGHT; y += 60) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(INTERNAL_WIDTH, y);
                ctx.stroke();
            }
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x - rect1.width/2 < rect2.x + rect2.width/2 &&
                rect1.x + rect1.width/2 > rect2.x - rect2.width/2 &&
                rect1.y - rect1.height/2 < rect2.y + rect2.height/2 &&
                rect1.y + rect1.height/2 > rect2.y - rect2.height/2
            );
        }

        function updateUI() {
            scoreBoard.innerHTML = `<div>SKOR: ${score}</div><span id="highScoreText">TERTINGGI: ${highScore}</span>`;
        }

        function triggerGameOver() {
            isGameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_runner_highscore', highScore.toString());
            }

            finalScore.innerText = score.toString();
            finalHighScore.innerText = `Tertinggi: ${highScore.toString()}`;
            gameOverScreen.classList.add('active');
        }

        function resetGame() {
            score = 0n;
            scoreTimer = 0;
            gameSpeed = initialSpeed;
            spawnInterval = 100;
            obstacles = [];
            spawnTimer = 0;
            player.lane = 0;
            player.x = lanes[0];
            isGameOver = false;
            gameOverScreen.classList.remove('active');
            updateUI();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, INTERNAL_WIDTH, INTERNAL_HEIGHT);

            drawBackground();

            if (!isGameOver) {
                scoreTimer++;
                if (scoreTimer >= 8) {
                    score += 1n;
                    scoreTimer = 0;
                    updateDifficulty();
                    updateUI();
                }

                player.update();

                spawnTimer++;
                if (spawnTimer >= spawnInterval) {
                    obstacles.push(new Obstacle());
                    spawnTimer = 0;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].update();
                    obstacles[i].draw();

                    if (checkCollision(player, obstacles[i])) {
                        triggerGameOver();
                    }

                    if (obstacles[i] && obstacles[i].y > INTERNAL_HEIGHT + 60) {
                        obstacles.splice(i, 1);
                    }
                }
            } else {
                for (let obs of obstacles) {
                    obs.draw();
                }
            }

            player.draw();
            requestAnimationFrame(gameLoop);
        }

        function moveLeft() {
            if (!isGameOver && player.lane > 0) player.lane--;
        }

        function moveRight() {
            if (!isGameOver && player.lane < 1) player.lane++;
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
        });

        window.addEventListener('touchstart', (e) => {
            if (isGameOver) return;
            const touchX = e.touches[0].clientX;
            const screenWidth = window.innerWidth;
            
            if (touchX < screenWidth / 2) {
                moveLeft();
            } else {
                moveRight();
            }
        });

        restartBtn.addEventListener('click', () => {
            resetGame();
        });

        updateUI();
        gameLoop();
    </script>
</body>
</html>
