<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 900px;
            background-color: #1a1c23;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #15161e;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        #scoreBoard {
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            text-align: center;
            pointer-events: auto;
            word-break: break-all;
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(13, 14, 21, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        #gameOverScreen.active {
            opacity: 1;
            pointer-events: auto;
        }
        h1 {
            font-size: 36px;
            color: #ff0055;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 30px;
        }
        #finalScore {
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
            word-break: break-all;
            padding: 0 20px;
            text-align: center;
        }
        #restartBtn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #15161e;
            background-color: #00ffcc;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        #restartBtn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div id="scoreBoard">SKOR: 0</div>
            <div class="controls-hint">Ketuk Kiri/Kanan Layar atau gunakan Panah/A-D</div>
        </div>

        <div id="gameOverScreen">
            <h1>Game Over</h1>
            <p>Skor Akhir Anda:</p>
            <p id="finalScore">0</p>
            <button id="restartBtn">MAIN LAGI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('scoreBoard');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // Target resolusi internal canvas untuk konsistensi game logic
        const INTERNAL_WIDTH = 400;
        const INTERNAL_HEIGHT = 700;
        canvas.width = INTERNAL_WIDTH;
        canvas.height = INTERNAL_HEIGHT;

        // System state menggunakan BigInt untuk skor tak terbatas
        let score = 0n;
        let scoreTimer = 0;
        let isGameOver = false;
        let gameSpeed = 5;
        const maxSpeed = 22;
        const acceleration = 0.0005;

        // Struktur jalur (2 Lane)
        const laneWidth = INTERNAL_WIDTH / 2;
        const lanes = [
            laneWidth / 2,                // Center lane 0 (Kiri)
            laneWidth + (laneWidth / 2)   // Center lane 1 (Kanan)
        ];

        // Objek Mobil Pemain
        const player = {
            lane: 0, // Mulai dari kiri
            x: lanes[0],
            y: INTERNAL_HEIGHT - 100,
            width: 45,
            height: 80,
            targetX: lanes[0],
            speed: 0.25, // Kecepatan interpolasi perpindahan jalur
            
            update() {
                this.targetX = lanes[this.lane];
                // Efek smooth movement perpindahan jalur
                this.x += (this.targetX - this.x) * this.speed;
            },
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Bayangan Neon (Glow)
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffcc';

                // Body Mobil Utama (Cyberpunk cyan)
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);

                // Kaca Depan (Gelap)
                ctx.fillStyle = '#0d0e15';
                ctx.fillRect(-this.width/2 + 6, -this.height/2 + 15, this.width - 12, 20);

                // Lampu Neon Depan
                ctx.shadowColor = '#ffffff';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-this.width/2 + 4, -this.height/2, 8, 4);
                ctx.fillRect(this.width/2 - 12, -this.height/2, 8, 4);

                // Lampu Belakang (Merah)
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(-this.width/2 + 4, this.height/2 - 4, 8, 4);
                ctx.fillRect(this.width/2 - 12, this.height/2 - 4, 8, 4);

                ctx.restore();
            }
        };

        // Rintangan (Obstacles)
        let obstacles = [];
        let spawnTimer = 0;
        let spawnInterval = 100; // interval frame pemunculan rintangan

        class Obstacle {
            constructor() {
                this.lane = Math.floor(Math.random() * 2);
                this.x = lanes[this.lane];
                this.y = -60;
                this.width = 50;
                this.height = 50;
                // Jenis: 'hole' (statis) atau 'car' (bergerak turun lebih cepat)
                this.type = Math.random() > 0.5 ? 'hole' : 'car';
                
                if (this.type === 'car') {
                    this.height = 75;
                    this.extraSpeed = 2; // Mobil lawan melaju turun ekstra cepat
                } else {
                    this.width = 55;
                    this.height = 35;
                    this.extraSpeed = 0;
                }
            }

            update() {
                this.y += gameSpeed + this.extraSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'hole') {
                    // Rintangan Lubang Jalan (Neon Kuning/Oranye)
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffaa00';
                    ctx.strokeStyle = '#ffaa00';
                    ctx.lineWidth = 3;
                    
                    // Gambar Elips Lubang
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Garis silang di dalam lubang (efek warning sign)
                    ctx.beginPath();
                    ctx.moveTo(-this.width/3, 0);
                    ctx.lineTo(this.width/3, 0);
                    ctx.stroke();
                } else {
                    // Rintangan Mobil Lawan Arah (Neon Magenta/Pink)
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff0055';
                    ctx.fillStyle = '#ff0055';
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);

                    // Kaca Depan (Menghadap ke bawah)
                    ctx.fillStyle = '#15161e';
                    ctx.fillRect(-this.width/2 + 6, this.height/2 - 35, this.width - 12, 20);

                    // Lampu Depan Mobil Lawan
                    ctx.shadowColor = '#ffff00';
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(-this.width/2 + 4, this.height/2 - 4, 8, 4);
                    ctx.fillRect(this.width/2 - 12, this.height/2 - 4, 8, 4);
                }

                ctx.restore();
            }
        }

        // Background Bergerak (Markah Jalan Neon)
        let roadLinesY = 0;

        function drawRoad() {
            // Gambar pembatas jalan di tengah
            ctx.save();
            ctx.shadowBlur = 8;
            ctx.shadowColor = rgbaColor(255, 255, 255, 0.2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 4;
            
            // Garis Kiri Luar & Kanan Luar
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(0, INTERNAL_HEIGHT);
            ctx.moveTo(INTERNAL_WIDTH, 0); ctx.lineTo(INTERNAL_WIDTH, INTERNAL_HEIGHT);
            ctx.stroke();

            // Efek Animasi Garis Putus-putus Tengah
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.lineWidth = 6;
            ctx.setLineDash([40, 40]);
            ctx.lineDashOffset = -roadLinesY;
            ctx.beginPath();
            ctx.moveTo(laneWidth, 0);
            ctx.lineTo(laneWidth, INTERNAL_HEIGHT);
            ctx.stroke();
            ctx.restore();

            // Gerakkan markah jalan
            roadLinesY += gameSpeed;
            if (roadLinesY >= 80) {
                roadLinesY = 0;
            }
        }

        function rgbaColor(r, g, b, a) {
            return `rgba(${r},${g},${b},${a})`;
        }

        // Logika Deteksi Tabrakan (AABB Collision Detection)
        function checkCollision(rect1, rect2) {
            // Hitung bounding box sebenarnya dari koordinat anchor center
            return (
                rect1.x - rect1.width/2 < rect2.x + rect2.width/2 &&
                rect1.x + rect1.width/2 > rect2.x - rect2.width/2 &&
                rect1.y - rect1.height/2 < rect2.y + rect2.height/2 &&
                rect1.y + rect1.height/2 > rect2.y - rect2.height/2
            );
        }

        // Input Handlers (Touch & Keyboard)
        function handleInput(side) {
            if (isGameOver) return;
            if (side === 'left') {
                player.lane = 0;
            } else if (side === 'right') {
                player.lane = 1;
            }
        }

        // Input Layar Sentuh (Bagi Layar 50% Kiri & 50% Kanan)
        window.addEventListener('touchstart', (e) => {
            const touchX = e.touches[0].clientX;
            const screenWidth = window.innerWidth;
            if (touchX < screenWidth / 2) {
                handleInput('left');
            } else {
                handleInput('right');
            }
        }, { passive: true });

        // Alternatif Input Keyboard untuk Laptop/Desktop (Arrow & A/D)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                handleInput('left');
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                handleInput('right');
            }
        });

        // Loop Game Utama
        function gameLoop() {
            if (isGameOver) return;

            // Bersihkan Canvas
            ctx.clearRect(0, 0, INTERNAL_WIDTH, INTERNAL_HEIGHT);

            // 1. Gambar Background Jalanan
            drawRoad();

            // 2. Update & Gambar Pemain
            player.update();
            player.draw();

            // 3. Manajemen Rintangan
            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                obstacles.push(new Obstacle());
                spawnTimer = 0;
                // Mengurangi interval spawn secara bertahap seiring bertambahnya kecepatan
                spawnInterval = Math.max(40, 100 - Math.floor(gameSpeed * 2));
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.update();
                obs.draw();

                // Cek Tabrakan
                if (checkCollision(player, obs)) {
                    triggerGameOver();
                    return;
                }

                // Hapus rintangan yang lolos ke bawah layar
                if (obs.y > INTERNAL_HEIGHT + 60) {
                    obstacles.splice(i, 1);
                }
            }

            // 4. Update Skor & Tingkat Kesulitan
            scoreTimer++;
            if (scoreTimer >= 5) { // Naikkan skor setiap beberapa frame
                score += 10n;      // Menggunakan BigInt safely
                scoreBoard.innerText = "SKOR: " + score.toString();
                scoreTimer = 0;
            }

            if (gameSpeed < maxSpeed) {
                gameSpeed += acceleration;
            }

            requestAnimationFrame(gameLoop);
        }

        // Trigger Game Over
        function triggerGameOver() {
            isGameOver = true;
            finalScore.innerText = score.toString();
            gameOverScreen.classList.add('active');
        }

        // Reset & Mulai Ulang Game
        function resetGame() {
            score = 0n;
            scoreTimer = 0;
            gameSpeed = 5;
            spawnInterval = 100;
            spawnTimer = 0;
            obstacles = [];
            player.lane = 0;
            player.x = lanes[0];
            player.targetX = lanes[0];
            isGameOver = false;
            scoreBoard.innerText = "SKOR: 0";
            gameOverScreen.classList.remove('active');
            gameLoop();
        }

        restartBtn.addEventListener('click', resetGame);

        // Menjalankan game untuk pertama kali
        resetGame();
    </script>
</body>
</html>
